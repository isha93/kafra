name: An agent isn't showing up right
description: An agent changed its log format and Kafra misreads it
labels: [agent-format]
body:
  - type: markdown
    attributes:
      value: |
        Kafra reads each agent's own session files, whose format isn't a public API and can change with any update.
        **Please don't paste transcripts**: they contain your prompts and code. The details below are enough.
  - type: dropdown
    id: agent
    attributes:
      label: Agent
      options: [Claude Code, Codex (CLI), Codex (Desktop), Gemini CLI, Cursor, OpenCode, Aider, other]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Agent version
      placeholder: "e.g. claude --version, codex --version"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What you see
      description: e.g. the agent is missing, stuck "thinking", in the wrong town, or HP is wrong.
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: Record types (optional, safe to share)
      description: |
        This prints only the record types and field names of your newest session, never their contents:
        `node -e 'const fs=require("fs");const f=process.argv[1];for(const l of fs.readFileSync(f,"utf8").split("\n").slice(-200)){try{const r=JSON.parse(l);console.log(r.type,r.payload?.type??"",Object.keys(r).join(","))}catch{}}' <session-file> | sort | uniq -c`
      render: text
