<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafra City</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="city.css">
</head>
<body class="city">

<div id="stage" class="stage"></div>

<div class="window panel worldmap">
  <div class="titlebar">
    <span class="title">World Map</span>
    <span class="count">
      <button id="replay-open" class="tb-btn" type="button" title="Putar ulang hari ini (R)">⏪ Replay</button>
      <button id="news-open" class="tb-btn" type="button" title="Koran Kafra hari ini">📰</button>
      <a href="party.html" title="Tampilan tabel">↗</a>
    </span>
  </div>
  <div id="towns" class="towns"><div class="empty">Menghubungi Kafra…</div></div>
  <div class="statusbar">
    <span id="conn" class="conn off">offline</span>
    <span id="mode" class="mode"></span>
    <span id="census"></span>
  </div>
</div>

<div id="replaybar" class="window panel replaybar" hidden>
  <div class="titlebar"><span class="title">⏪ Replay</span><span class="count" id="rb-time">--:--</span></div>
  <div class="rb-row">
    <button id="rb-play" class="rb-btn" type="button" title="Putar / jeda (Spasi)">▶</button>
    <select id="rb-speed" class="rb-speed" title="Kecepatan">
      <option value="10">×10</option><option value="60" selected>×60</option><option value="300">×300</option><option value="1200">×1200</option>
    </select>
    <input id="rb-day" class="rb-day" type="date" title="Pilih hari">
    <div class="rb-track"><div id="rb-marks" class="rb-marks"></div><input id="rb-slider" type="range" min="0" max="1000" value="0"></div>
    <button id="rb-news" class="rb-btn" type="button" title="Koran hari ini">📰</button>
    <button id="rb-live" class="rb-btn live" type="button" title="Kembali ke sekarang (Esc)">● Live</button>
  </div>
</div>

<div id="news" class="window news" hidden></div>

<div class="window panel info">
  <div class="titlebar">
    <span class="title" id="detail-title">Kafra Service</span>
    <span class="count">Tab · Esc · M</span>
  </div>
  <div id="detail" class="detail"></div>
</div>

<div class="window panel partybar">
  <div class="titlebar">
    <span class="title">Party</span>
    <span class="count">
      <button id="notify" class="tb-btn" type="button">🔔 notifikasi</button>
      <button id="sound" class="tb-btn" type="button">🔈 suara</button>
      <button id="music" class="tb-btn" type="button">🎵 musik</button>
    </span>
  </div>
  <div id="party" class="party-row"></div>
</div>

<div class="window panel chat">
  <div class="titlebar"><span class="title">Chat Log</span></div>
  <div id="log" class="log"></div>
</div>

<!-- Classic scripts first: PixiJS, then its no-eval patch (see VENDOR in src/server.mjs). -->
<script src="/vendor/pixi.js"></script>
<script src="/vendor/pixi-csp.js"></script>
<script src="city/main.js" type="module"></script>
</body>
</html>
