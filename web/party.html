<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafra — Party Window</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="window" id="party">
  <div class="titlebar">
    <span class="title" data-i18n="pw.title">Party Window</span>
    <span class="count"><span id="count">—</span> · <a href="/" style="color:#fff" data-i18n="pw.city">Kafra City ↗</a></span>
  </div>

  <div class="columns">
    <span class="c-sprite"></span>
    <span class="c-name" data-i18n="pw.adventurer">Adventurer</span>
    <span class="c-job" data-i18n="pw.job">Job</span>
    <span class="c-hp" data-i18n="pw.context">Context</span>
    <span class="c-status" data-i18n="pw.status">Status</span>
  </div>

  <div id="rows" class="rows">
    <div class="empty" data-i18n="ui.connecting">Calling Kafra…</div>
  </div>

  <div class="statusbar">
    <span id="conn" class="conn off">offline</span>
    <span id="scanned"></span>
  </div>
</div>

<script src="app.js" type="module"></script>
</body>
</html>
